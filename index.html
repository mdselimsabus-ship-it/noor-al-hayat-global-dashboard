<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NOOR</title><style>body{background:#0a0e1a;color:#fff;padding:10px;font-family:sans-serif}.card{margin:10px 0;background:#1a2035;padding:15px;border-radius:12px}.btn{width:100%;padding:12px;background:#00c853;border:none;color:#fff;border-radius:8px;margin-top:8px}</style></head><body>
<h2>নূর আল হায়াত - ১৬৭ ফাংশন</h2><p>NSR #08430004 | V12 Royal</p>
<div id="m"></div>
<div id="pop" style="display:none;position:fixed;inset:0;background:#000d;z-index:99;padding:20px"><div style="background:#162040;padding:15px;border-radius:12px"><div style="display:flex;justify-content:space-between"><b id="t"></b><span onclick="document.getElementById('pop').style.display='none'" style="font-size:22px">✕</span></div><div id="l" style="margin-top:10px"></div></div></div>
<script>
const mods=[{id:'a',n:'নিয়োগ মাস্টার ২৮টি',c:['সিভি আপলোড','সিভি লিস্ট','ভিসা']},{id:'b',n:'কৃষি ১৮টি',c:['কৃষক','জমি','বীজ']},{id:'c',n:'অ্যাকাউন্ট ২০টি',c:['৮০০০ MDR','৬০% ওয়াকফ','ব্যালেন্স']},{id:'d',n:'অ্যাডমিন ৩৪টি সুরক্ষিত',p:1,c:['NSR ড্যাশবোর্ড','ইউজার','সিকিউরিটি']}];
function r(){let h='';mods.forEach(x=>{h+=`<div class=card><b>${x.n}</b><br><button class=btn onclick="o('${x.id}')">মডিউল খুলুন</button></div>`});document.getElementById('m').innerHTML=h}
function o(id){let m=mods.find(x=>x.id==id);if(m.p){let p=prompt('Password NH1000:');if(p!=='NH1000'){alert('Access Denied');return}}document.getElementById('t').innerText=m.n;let s='';m.c.forEach((f,i)=>{s+=`<div style="background:#1f2b4a;padding:10px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between">${i+1}. ${f} <button onclick="alert('Opening ${f}')" style="background:#00c853;border:none;color:#fff;padding:4px 10px;border-radius:10px">Open</button></div>`});document.getElementById('l').innerHTML=s;document.getElementById('pop').style.display='flex'}
r();
</script></body></html>
