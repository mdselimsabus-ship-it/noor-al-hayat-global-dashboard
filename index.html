<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOOR AL HAYAT GLOBAL</title>
<style>
body{margin:0;font-family:Arial;background:#b30000}
.topbar{background:#b30000;text-align:center;padding:20px 10px 10px 10px}
#noorLogo{width:180px;height:180px;border-radius:50%;border:3px solid gold;box-shadow:0 0 25px gold;display:block;margin:0 auto;object-fit:cover;background:white;cursor:pointer}
.title{color:gold;font-size:26px;font-weight:900;margin:12px 0 0 0}
.sub{color:#ffe6a0;font-size:12px;line-height:1.4}
.hint{color:#fff;font-size:10px;opacity:0.7;margin-top:8px}
.container{padding:15px;max-width:900px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;margin-top:15px;min-height:600px}
.card{background:#fff8f0;border:1px solid gold;border-radius:16px;padding:15px;margin:12px 0}
.btn{background:#b30000;color:gold;border:1px solid gold;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
#superAdmin{display:none;background:#111;color:#0f0;padding:18px;border-radius:14px;border:2px solid gold;margin:16px 0}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccc;box-sizing:border-box}
</style>
</head>
<body>
<div class="topbar">
<img id="noorLogo" src="logo.png" alt="NOOR AL HAYAT GLOBAL LOGO">
<div class="title">NOOR AL HAYAT GLOBAL</div>
<div class="sub">BANGLADESH AGRO • FOOD PROCESS • RECRUITMENT SOCIAL TRANSACTION<br><b style="color:gold">FAIR & ETHICAL ECOSYSTEM</b></div>
<div class="hint">লোগোতে ৩ বার ট্যাপ = Super Admin |?admin = Backup | noor = PC</div>
</div>

<div class="container">
<div class="card"><h3>🌾 Worker Management</h3>
<input id="workerName" placeholder="Worker Name"><input id="passport" placeholder="Passport">
<select id="bmet"><option>BMET: Pending</option><option>Verified</option></select>
<button class="btn" onclick="addWorker()">+ Add Worker</button><div id="workerList"></div></div>

<div class="card"><h3>💰 Halal Cash Ledger</h3>
<input id="amount" type="number" placeholder="Amount ৳"><input id="purpose" placeholder="Purpose">
<button class="btn" onclick="addLedger()">Add Ledger</button><div id="ledgerList"></div></div>

<div class="card"><h3>✅ ILO 11 Checklist</h3><div id="iloList"></div><p id="iloStatus"></p>
<button class="btn" onclick="exportPDF()">📄 Export Audit PDF + QR</button></div>

<div id="superAdmin"><h2 style="color:gold">🔐 SUPER ADMIN - MD SELIM SABUS</h2><div id="logArea"></div>
<button class="btn" style="background:gold;color:#000" onclick="localStorage.clear();location.reload()">Clear All</button>
<button class="btn" onclick="document.getElementById('superAdmin').style.display='none'" style="margin-left:8px">Close</button></div>

<div class="card"><h4>📋 Audit Log</h4><div id="auditLog" style="font-size:11px"></div></div>
</div>

<script>
let workers=JSON.parse(localStorage.getItem('nah_w')||'[]'),ledgers=JSON.parse(localStorage.getItem('nah_l')||'[]'),logs=JSON.parse(localStorage.getItem('nah_lo')||'[]');
function addLog(a,d=''){let t=new Date().toLocaleString('bn-BD');logs.unshift(t+' - '+a+' '+(d||''));localStorage.setItem('nah_lo',JSON.stringify(logs));renderLogs()}
function renderLogs(){document.getElementById('auditLog').innerHTML=logs.slice(0,25).join('<br>');let la=document.getElementById('logArea');if(la)la.innerHTML=logs.slice(0,3).join('<br>')}
function renderWorkers(){document.getElementById('workerList').innerHTML=workers.map(w=>'<div>👷 '+w.name+' - '+w.passport+'</div>').join('')}
function renderLedgers(){document.getElementById('ledgerList').innerHTML=ledgers.map(l=>'<div>৳'+l.amount+' - '+l.purpose+'</div>').join('')}
function addWorker(){let n=document.getElementById('workerName').value.trim();if(!n)return alert('নাম দিন');workers.unshift({name:n,passport:document.getElementById('passport').value});localStorage.setItem('nah_w',JSON.stringify(workers));renderWorkers();addLog('ADD WORKER',n)}
function addLedger(){let a=document.getElementById('amount').value;if(!a)return;ledgers.unshift({amount:a,purpose:document.getElementById('purpose').value});localStorage.setItem('nah_l',JSON.stringify(ledgers));renderLedgers();addLog('LEDGER','৳'+a)}
const iloPoints=["No Fees","No Passport Hold","Contract Mother Tongue","No Discrimination","Freedom Movement","No Salary Deception","Safe Work","Grievance","No Child Labour","Halal Income","BMET Verified"];
let iloS=JSON.parse(localStorage.getItem('iloS')||'{}');
function renderILO(){let h='',c=0;iloPoints.forEach((pt,i)=>{if(iloS[i])c++;h+='<label style="display:block;margin:6px 0"><input type="checkbox" '+(iloS[i]?'checked':'')+' onchange="toggleILO('+i+')"> '+(i+1)+'. '+pt+'</label>'});document.getElementById('iloList').innerHTML=h;document.getElementById('iloStatus').innerHTML=c===11?'<b style="color:green">✅ 11/11 PASS</b>':'<b style="color:red">❌ '+c+'/11 FAIL</b>'}
function toggleILO(i){iloS[i]=!iloS[i];localStorage.setItem('iloS',JSON.stringify(iloS));renderILO();addLog('ILO',iloPoints[i])}
function exportPDF(){if(Object.values(iloS).filter(v=>v).length!==11){alert('11 PASS করুন');return}addLog('EXPORT PDF');alert('✅ Audit PDF Ready!')}
renderWorkers();renderLedgers();renderLogs();renderILO();
let taps=0,last=0;function openAdmin(){let p=prompt('🔐 Super Admin Password?');if(p==='NH1000'){document.getElementById('superAdmin').style.display='block';addLog('SUPER ADMIN LOGIN','3-click');window.scrollTo({top:document.getElementById('superAdmin').offsetTop-20,behavior:'smooth'})}else if(p){alert('ভুল');}}
document.getElementById('noorLogo').addEventListener('click',()=>{let now=Date.now();if(now-last>1500)taps=0;last=now;taps++;if(taps>=3){taps=0;openAdmin()}});
let keys='';document.addEventListener('keypress',e=>{keys+=e.key.toLowerCase();if(keys.includes('noor')){openAdmin();keys=''};if(keys.length>15)keys=''});
if(location.search.includes('admin'))setTimeout(openAdmin,600);
</script>
</body>
</html>
