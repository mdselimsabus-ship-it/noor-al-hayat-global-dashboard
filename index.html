<script>
const mods=[
{icon:'fa-users',c:'from-emerald-500 to-teal-500',t:'Recruitment Master',d:'28 Functions',s:'CV, Interview, Medical, Visa'},
{icon:'fa-tractor',c:'from-green-500 to-lime-500',t:'Bangladesh Agro',d:'18 Functions',s:'Agro Project'},
{icon:'fa-utensils',c:'from-orange-500 to-red-500',t:'Food Process',d:'15 Functions',s:'Processing'},
{icon:'fa-hand-holding-heart',c:'from-blue-500 to-cyan-500',t:'Waqf & Trust',d:'12 Functions',s:'60% Waqf'},
{icon:'fa-file-invoice-dollar',c:'from-amber-500 to-yellow-600',t:'Accounts 8000 MVR',d:'20 Functions',s:'Fee, Profit'},
{icon:'fa-plane',c:'from-sky-500 to-blue-600',t:'Travel & Ticket',d:'12 Functions',s:'Ticket, Hotel'},
{icon:'fa-store',c:'from-purple-500 to-pink-500',t:'Global Business',d:'18 Functions',s:'Import Export'},
{icon:'fa-shield-halved',c:'from-red-500 to-red-800',t:'Admin & NSR',d:'34 Functions - SECURED',s:'NSR #08430004',secure:true}
];
document.getElementById('mods').innerHTML=mods.map(m=>`<div class="bg-slate-800 rounded-xl overflow-hidden ${m.secure?'hidden border-2 border-red-500' : ''}" id="${m.secure?'adminCard':''}"><div class="bg-gradient-to-r ${m.c} p-4 flex gap-3 items-center"><i class="fa ${m.icon}"></i><div><h3 class="font-bold">${m.t}</h3><p class="text-xs opacity-80">${m.d}</p></div></div><div class="p-3"><p class="text-xs opacity-60 mb-2">${m.s}</p><button class="w-full bg-slate-700 py-2 rounded-lg text-sm ${m.secure?'bg-red-600 font-bold':''}">${m.secure?'🔓 Open Secure Module':'Open Module'}</button></div></div>`).join('');

// Logo Fallback
document.getElementById('logo').onerror=function(){this.src='https://via.placeholder.com/100?text=NH';};

// --- ROYAL 3 CLICK + NH1000 SECURITY ---
let clicks=0; let timer=null;
const logo=document.getElementById('logo');
const PASSWORD="NH1000";
logo.addEventListener('click',()=>{
 clicks++; logo.style.boxShadow=`0 0 ${clicks*10}px gold`;
 if(timer) clearTimeout(timer); timer=setTimeout(()=>{clicks=0; logo.style.boxShadow='';},1500);
 if(clicks===3){ 
   clicks=0; logo.style.boxShadow='';
   const p=prompt('🔐 Royal Security - 3 Click Verified\nEnter Password:');
   if(p===PASSWORD){ 
     document.getElementById('adminCard').classList.remove('hidden');
     document.getElementById('adminCard').scrollIntoView({behavior:'smooth'});
     alert('✅ Admin Unlocked - NH1000 Verified');
     sessionStorage.setItem('adminUnlock','true');
   } else if(p!==null){ alert('❌ Wrong Password!'); }
 }
});
if(sessionStorage.getItem('adminUnlock')==='true'){ const c=document.getElementById('adminCard'); if(c) c.classList.remove('hidden'); }
</script>
<script src="./kalyan_167_final.js"></script>
</body>
</html>
