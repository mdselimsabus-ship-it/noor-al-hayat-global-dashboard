name: Genesis Sovereignty Controller

on:
  push:
    branches: [ main ]
  workflow_dispatch: # এটি বাটন প্রেস করার সময় সিগনাল পাঠাবে

jobs:
  run-genesis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Core Logic
        run: |
          python kernel.py
